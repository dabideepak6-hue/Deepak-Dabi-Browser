<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Deepak Dabi Browser</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif;
}

body{
background:#1e1e1e;
color:#fff;
height:100vh;
overflow:hidden;
}

/* Header */

header{
height:40px;
background:#202124;
display:flex;
align-items:center;
padding:0 10px;
border-bottom:1px solid #333;
}

.logo{
font-size:18px;
font-weight:bold;
color:#00d4ff;
}

/* Tabs */

.tabs{
height:42px;
background:#2b2b2b;
display:flex;
align-items:center;
overflow-x:auto;
padding:0 10px;
gap:8px;
}

.tab{
min-width:180px;
height:32px;
background:#3a3a3a;
border-radius:8px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 12px;
cursor:pointer;
transition:.3s;
}

.tab.active{
background:#4c8bf5;
}

.tab button{
background:none;
border:none;
color:white;
cursor:pointer;
font-size:15px;
}

.newTab{
width:34px;
height:34px;
border-radius:50%;
background:#444;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
font-size:22px;
transition:.3s;
}

.newTab:hover{
background:#666;
}

/* Toolbar */

.toolbar{
height:50px;
background:#292929;
display:flex;
align-items:center;
padding:0 10px;
gap:10px;
}

.navBtn{

width:38px;
height:38px;

border:none;
border-radius:50%;

background:#3b3b3b;
color:white;

font-size:18px;
cursor:pointer;

transition:.3s;

}

.navBtn:hover{

background:#4c8bf5;

}

/* Address Bar */

.addressBar{

flex:1;

display:flex;

}

.addressBar input{

width:100%;

height:40px;

border:none;

outline:none;

padding:0 15px;

border-radius:20px;

font-size:15px;

background:#fff;

color:#000;

}

.goBtn{

margin-left:8px;

width:70px;

border:none;

border-radius:20px;

background:#4caf50;

color:white;

cursor:pointer;

font-weight:bold;

}

/* Main */

main{

display:flex;

height:calc(100vh - 132px);

}

/* Sidebar */

.sidebar{

width:220px;

background:#252525;

border-right:1px solid #333;

padding:15px;

}

.sidebar h3{

margin-bottom:15px;

}

.sidebar ul{

list-style:none;

}

.sidebar li{

padding:10px;

border-radius:6px;

cursor:pointer;

margin-bottom:6px;

}

.sidebar li:hover{

background:#3b3b3b;

}

/* Browser Area */

.browser{

flex:1;

background:#111;

position:relative;

}

iframe{

width:100%;

height:100%;

border:none;

background:white;

}

</style>
</head>

<body>

<header>

<div class="logo">

🌐 Deepak Dabi Browser

</div>

</header>

<div class="tabs">

<div class="tab active">

<span>New Tab</span>

<button>×</button>

</div>

<div class="newTab">+</div>

</div>

<div class="toolbar">

<button class="navBtn">←</button>

<button class="navBtn">→</button>

<button class="navBtn">⟳</button>

<button class="navBtn">🏠</button>

<div class="addressBar">

<input
type="text"
placeholder="Search Google or Enter Website URL">

<button class="goBtn">

GO

</button>

</div>

</div>

<main>

<div class="sidebar">

<h3>Quick Access</h3>

<ul>

<li>🏠 Home</li>

<li>⭐ Bookmarks</li>

<li>🕒 History</li>

<li>📥 Downloads</li>

<li>⚙ Settings</li>

<li>🌙 Dark Mode</li>

</ul>

</div>

<div class="browser">

<iframe
id="browserFrame"
src="https://example.com">
</iframe>

</div>

</main>

<!-- Part 2 में JavaScript और Navigation Functions जोड़ेंगे -->

</body>
</html>
