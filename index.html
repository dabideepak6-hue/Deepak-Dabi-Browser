<script>


let familyData = JSON.parse(localStorage.getItem("dabiFamily")) || [

{
id:1,
name:"दादा जी",
english:"Grand Father",
relation:"Root",
photo:"https://cdn-icons-png.flaticon.com/512/4140/4140048.png",
parent:null
},

{
id:2,
name:"पिता जी",
english:"Father",
relation:"Son",
photo:"https://cdn-icons-png.flaticon.com/512/4140/4140048.png",
parent:1
},

{
id:3,
name:"Deepak Dabi",
english:"Deepak",
relation:"Son",
photo:"https://cdn-icons-png.flaticon.com/512/4140/4140048.png",
parent:2
}

];


function saveData(){

localStorage.setItem(
"dabiFamily",
JSON.stringify(familyData)
);

}



function loadTree(){

let tree=document.getElementById("tree");

tree.innerHTML="";


let root=familyData.find(x=>x.parent==null);


if(root){

tree.innerHTML=createMember(root);

let child=getChildren(root.id);

if(child.length){

tree.innerHTML+=`
<div class="line"></div>
<div class="children">
${child.map(createMember).join("")}
</div>
`;

}

}


}



function createMember(person){


return `

<div class="member"
onclick="viewMember(${person.id})">


<img src="${person.photo}">


<h3>${person.name}</h3>

<span>${person.english}</span>

<span>${person.relation}</span>


</div>


`;


}



function getChildren(id){

return familyData.filter(
x=>x.parent==id
);

}


loadTree();


</script>

<script>


// VIEW MEMBER DETAILS

function viewMember(id){

let person = familyData.find(
x=>x.id==id
);


if(!person) return;


alert(
"👤 Name: "+person.name+
"\n🌐 English: "+person.english+
"\n🔗 Relation: "+person.relation
);


}



// ADD NEW FAMILY MEMBER

function addMember(){


let parentId = prompt(
"Parent ID डालें (किसके नीचे जोड़ना है)"
);


if(!parentId){

alert("Parent ID जरूरी है");

return;

}



let name = prompt(
"नाम लिखें (Hindi)"
);


if(!name) return;



let english = prompt(
"English Name"
);



let relation = prompt(
"Relation (Father/Son/Daughter etc.)"
);



let newMember={

id:Date.now(),

name:name,

english:english || "",

relation:relation || "",

photo:
"https://cdn-icons-png.flaticon.com/512/4140/4140048.png",

parent:Number(parentId)

};



familyData.push(newMember);


saveData();

loadTree();


alert(
"✅ Member Added Successfully"
);


}



// BACKUP DATA

function backupData(){


let data =
JSON.stringify(
familyData,
null,
2
);



let blob =
new Blob(
[data],
{
type:"application/json"
}
);



let url =
URL.createObjectURL(blob);



let a =
document.createElement("a");


a.href=url;

a.download=
"Dabi_Family_Backup.json";


a.click();


}



// PRINT FAMILY TREE

function printTree(){

window.print();

}




</script>

<div class="search-box">

<input 
type="text"
id="search"
placeholder="🔍 Search Family Member..."
onkeyup="searchMember()">

</div>





<script>


// COMPLETE TREE GENERATOR


function loadTree(){


let tree=document.getElementById("tree");


tree.innerHTML="";



let root =
familyData.find(
x=>x.parent==null
);



if(root){


tree.innerHTML =
createBranch(root);



}


}




function createBranch(person){


let html=`


<div class="branch">


<div class="member gold-border">


<img src="${person.photo}">


<h3>${person.name}</h3>


<span>${person.english}</span>


<span>${person.relation}</span>



<button onclick="deleteMember(${person.id})">

Delete

</button>


</div>



`;



let children =
getChildren(person.id);



if(children.length>0){


html+=`

<div class="horizontal-line"></div>

<div class="family-level">

`;



children.forEach(child=>{


html+=createBranch(child);



});


html+=`

</div>

`;



}



html+=`</div>`;


return html;


}






// SEARCH FUNCTION


function searchMember(){


let value =
document.getElementById("search")
.value
.toLowerCase();



let members =
document.querySelectorAll(".member");



members.forEach(card=>{


if(
card.innerText
.toLowerCase()
.includes(value)

)

{

card.style.display="inline-block";

}

else{

card.style.display="none";

}


});


}




// DELETE MEMBER


function deleteMember(id){


let confirmDelete =
confirm(
"क्या आप इस Member को Delete करना चाहते हैं?"
);



if(!confirmDelete)
return;



familyData =
familyData.filter(
x=>x.id!=id
);



saveData();


loadTree();


}




</script>

<script>





// OPEN PROFILE



function viewMember(id){


let person =
familyData.find(
x=>x.id==id
);



if(!person)return;



document.getElementById("pPhoto").src=
person.photo;



document.getElementById("pName").innerHTML=
"👤 "+person.name;



document.getElementById("pEnglish").innerHTML=
"🌐 "+person.english;



document.getElementById("pRelation").innerHTML=
"🔗 "+person.relation;



document.getElementById("pDOB").innerHTML=
"🎂 "+(person.dob||"");



document.getElementById("pMobile").innerHTML=
"📞 "+(person.mobile||"");



document.getElementById("pAddress").innerHTML=
"📍 "+(person.address||"");



document.getElementById("profile").style.display="block";


document.getElementById("overlay").style.display="block";


}






function closeProfile(){


document.getElementById("profile").style.display="none";


document.getElementById("overlay").style.display="none";


}






// SHOW FORM


function addMember(){


document.getElementById("memberForm")
.style.display="block";


}







// HIDE FORM


function hideForm(){


document.getElementById("memberForm")
.style.display="none";


}






// SAVE MEMBER


function saveMember(){



let parent =
prompt(
"Parent ID डालें"
);



let file =
document.getElementById("mPhoto")
.files[0];




let photo=
"https://cdn-icons-png.flaticon.com/512/4140/4140048.png";




if(file){


let reader =
new FileReader();


reader.onload=function(e){


photo=e.target.result;


addNew(photo);


};


reader.readAsDataURL(file);



}

else{


addNew(photo);


}





function addNew(photo){



let member={


id:Date.now(),


name:
document.getElementById("mName").value,


english:
document.getElementById("mEnglish").value,


relation:
document.getElementById("mRelation").value,


dob:
document.getElementById("mDOB").value,


mobile:
document.getElementById("mMobile").value,


address:
document.getElementById("mAddress").value,


photo:photo,


parent:Number(parent)


};




familyData.push(member);


saveData();


loadTree();


hideForm();



}




}




</script>

<script>





let editID=null;





// EDIT MEMBER



function editMemberPrompt(){


let id =
prompt(
"जिस Member को Edit करना है उसका ID डालें"
);



if(!id)return;



let person =
familyData.find(
x=>x.id==id
);



if(!person){


alert(
"Member नहीं मिला"
);


return;

}



let name =
prompt(
"नाम बदलें",
person.name
);



let english =
prompt(
"English Name",
person.english
);



let relation =
prompt(
"Relation",
person.relation
);





person.name =
name || person.name;



person.english =
english || person.english;



person.relation =
relation || person.relation;




saveData();


loadTree();



alert(
"✅ Member Updated"
);



}







// DOWNLOAD COMPLETE BACKUP



function downloadFullBackup(){



let backup={


title:"Dabi Family Tree",


date:
new Date().toLocaleString(),


members:
familyData



};




let blob =
new Blob(
[
JSON.stringify(
backup,
null,
2
)
],
{
type:"application/json"
}
);




let link =
document.createElement("a");



link.href=
URL.createObjectURL(blob);



link.download=
"Dabi_Family_Full_Backup.json";



link.click();



}








// RESTORE BACKUP



function restoreBackup(){


let input =
document.createElement("input");



input.type="file";


input.accept=".json";



input.onchange=function(e){



let file =
e.target.files[0];



let reader =
new FileReader();



reader.onload=function(){



try{


let data =
JSON.parse(
reader.result
);



if(data.members){


familyData =
data.members;


}

else{


familyData =
data;


}



saveData();


loadTree();



alert(
"♻️ Backup Restore Successfully"
);



}

catch{


alert(
"Invalid Backup File"
);


}



};



reader.readAsText(file);



};



input.click();



}







</script>

</div>







<script>





// DASHBOARD UPDATE



function updateDashboard(){


document.getElementById("totalMember")
.innerHTML=
familyData.length;




let generations=0;



familyData.forEach(x=>{


let level=0;

let parent=x.parent;



while(parent){


level++;


let p=
familyData.find(
a=>a.id==parent
);


if(p)

parent=p.parent;

else

break;


}



if(level>generations)

generations=level;



});




document.getElementById("generation")
.innerHTML=
generations+1;






let male =
familyData.filter(
x=>
x.gender=="Male"
).length;



let female =
familyData.filter(
x=>
x.gender=="Female"
).length;



document.getElementById("maleCount")
.innerHTML=
male;



document.getElementById("femaleCount")
.innerHTML=
female;



checkBirthday();


}







// BIRTHDAY CHECK



function checkBirthday(){



let today =
new Date();



let day =
today.getDate();



let month =
today.getMonth()+1;




let found =
familyData.find(
x=>{


if(!x.dob)
return false;



let d =
new Date(x.dob);



return(
d.getDate()==day &&
d.getMonth()+1==month
);



}

);




let box =
document.getElementById("birthdayBox");



if(found){


box.style.display="block";


box.innerHTML=
"🎂 Happy Birthday ❤️<br>"+
found.name;



box.classList.add(
"highlight"
);



}

else{


box.style.display="none";


}



}






updateDashboard();






</script>

<script>




// WHATSAPP SHARE



function shareWhatsApp(){


let text =

"👑 Dabi Family Tree\n\n"+
"हमारा परिवार वृक्ष देखें 🌳\n"+
"Total Members : "+
familyData.length;



let url =
"https://wa.me/?text="
+
encodeURIComponent(text);



window.open(url);


}







// QR GENERATOR



function generateQR(){


let qr =
"https://api.qrserver.com/v1/create-qr-code/?size=300x300&data="
+
encodeURIComponent(
window.location.href
);



let img =
document.getElementById("qrImage");



img.src=qr;


img.style.display="block";


}








// SAVE TREE IMAGE



function downloadTreeImage(){


alert(
"🖼 Tree Image Export तैयार किया जा रहा है..."
);



window.print();



}






</script>

🔐 Protect Family Data

⚠️ Reset Tree

</button>

<script>





// AUTO SAVE MESSAGE



function saveData(){


localStorage.setItem(

"dabiFamily",

JSON.stringify(familyData)

);



let status =
document.getElementById(
"saveStatus"
);



if(status){


status.style.display="block";


setTimeout(()=>{


status.style.display="none";


},1500);



}



}








// DATA PROTECTION



function protectData(){


let password =
prompt(
"Set Family Tree Password"
);



if(password){


localStorage.setItem(
"dabiPassword",
password
);



alert(
"🔐 Family Data Protected"
);



}



}








// RESET DATA



function clearAllData(){


let check =
confirm(
"पूरा Family Tree Delete करना चाहते हैं?"
);



if(check){


localStorage.removeItem(
"dabiFamily"
);



location.reload();


}



}








// FINAL INITIALIZATION



setTimeout(()=>{


loadTree();


updateDashboard();


loadGallery();



},500);






</script>
